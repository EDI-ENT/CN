<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengajuan CN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1FB;
    --paper:#FFFFFF;
    --ink:#1B1030;
    --muted:#6E6487;
    --line:#E7E1F7;
    --violet:#7C3AED;
    --violet-dark:#5B21B6;
    --pink:#FF3D81;
    --lime:#39E991;
    --lime-ink:#0E6B45;
    --amber:#FFB020;
    --amber-ink:#8A5A12;
    --red:#FF4D4D;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:460px;margin:0 auto;padding-bottom:60px}

  /* ---- Header dengan blob ---- */
  .hero{
    position:relative;
    overflow:hidden;
    padding:36px 24px 44px;
    background:linear-gradient(135deg,#7C3AED 0%,#9333EA 55%,#FF3D81 100%);
    border-radius:0 0 32px 32px;
  }

  /* ---- Layout desktop/laptop: hero jadi sidebar kiri, konten di kanan ---- */
  @media (min-width:860px){
    body{display:flex;justify-content:center;padding:40px 24px}
    .wrap{
      max-width:980px;
      display:grid;
      grid-template-columns:300px 1fr;
      gap:28px;
      align-items:start;
      padding-bottom:0;
    }
    .hero{
      border-radius:28px;
      position:sticky;
      top:40px;
      padding:40px 28px;
    }
    .hero h1{font-size:34px}
    .section{padding:0}
  }
  .hero::before{
    content:"";
    position:absolute;
    width:220px;height:220px;
    background:rgba(255,255,255,.15);
    border-radius:50%;
    top:-90px; right:-60px;
  }
  .hero::after{
    content:"";
    position:absolute;
    width:140px;height:140px;
    background:var(--lime);
    opacity:.35;
    border-radius:50%;
    bottom:-60px; left:-40px;
  }
  .hero h1{
    position:relative;
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:30px;
    color:#fff;
    margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  .hero p{
    position:relative;
    color:rgba(255,255,255,.88);
    margin:0;
    font-size:14px;
    font-weight:500;
  }

  /* ---- Sections ---- */
  .section{padding:20px 20px 0}
  .card{
    background:var(--paper);
    border-radius:20px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 4px 20px rgba(124,58,237,.06);
  }
  .card h2{
    font-family:'Sora',sans-serif;
    font-size:15px;
    font-weight:700;
    margin:0 0 14px;
    color:var(--violet-dark);
  }

  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 6px}
  label:first-child{margin-top:0}
  input,textarea{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:12px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    background:#FBFAFE;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--violet)}

  .btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    margin-top:14px;
    transition:transform .1s;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--violet);color:#fff}
  .btn-primary:disabled{background:#D9D2F3;color:#fff;cursor:not-allowed}

  /* ---- Search results ---- */
  .result-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;
    border-radius:14px;
    background:#FBFAFE;
    border:1.5px solid var(--line);
    margin-bottom:8px;
    cursor:pointer;
  }
  .result-item:hover{border-color:var(--violet)}
  .result-item .nama{font-weight:700;font-size:14px}
  .result-item .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .result-item .saldo{font-family:'Sora',sans-serif;font-weight:700;color:var(--violet-dark);font-size:13px}

  /* ---- Selected user chip ---- */
  .chip{
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(135deg,#EDE6FD,#FCE4EE);
    border-radius:16px;
    padding:14px 16px;
  }
  .chip .nama{font-weight:700;font-size:15px}
  .chip .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .chip .saldo-label{font-size:11px;color:var(--muted);text-align:right}
  .chip .saldo-val{font-family:'Sora',sans-serif;font-weight:800;font-size:17px;color:var(--violet-dark);text-align:right}
  .ganti{background:none;border:none;color:var(--pink);font-weight:700;font-size:12.5px;cursor:pointer;margin-top:10px;padding:0}

  /* ---- Status banner ---- */
  .banner{
    border-radius:14px;
    padding:13px 15px;
    font-size:13.5px;
    font-weight:600;
    margin-top:12px;
    display:none;
  }
  .banner.show{display:block}
  .banner.ok{background:#E3FBF0;color:var(--lime-ink)}
  .banner.warn{background:#FFF4E0;color:var(--amber-ink)}
  .banner.err{background:#FFE9E9;color:#B3261E}

  /* ---- Status pills (riwayat) ---- */
  .riwayat-item{
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px;
    margin-bottom:10px;
  }
  .riwayat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .riwayat-nominal{font-family:'Sora',sans-serif;font-weight:800;font-size:16px}
  .riwayat-ket{font-size:12.5px;color:var(--muted);margin-top:4px}
  .riwayat-tgl{font-size:11px;color:var(--muted);margin-top:8px}
  .pill{
    font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;
  }
  .pill-wait{background:#FFF4E0;color:var(--amber-ink)}
  .pill-ok{background:#E3FBF0;color:var(--lime-ink)}
  .pill-no{background:#FFE9E9;color:#B3261E}

  /* ---- Riwayat berbentuk baris ---- */
  .rw-head,.rw-row{display:grid;grid-template-columns:82px minmax(0,1.5fr) minmax(0,1.5fr) 105px 150px 64px;gap:10px;align-items:center;padding:9px 4px}
  .rw-head{font-size:11px;font-weight:700;color:var(--muted);border-bottom:1.5px solid var(--line)}
  .rw-row{border-bottom:1px solid var(--line);font-size:12.5px}
  .rw-row:last-child{border-bottom:none}
  .rw-dokter b{display:block;font-size:12.5px}
  .rw-dokter span{font-size:11px;color:var(--muted)}
  .rw-ket{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rw-jml{text-align:right;font-weight:700}
  .rw-tgl{font-size:11.5px;color:var(--muted)}
  .rw-status .pill{white-space:normal;text-align:center;display:inline-block}
  .rw-aksi .btn-cetak-nota{margin-top:0}
  @media (max-width:700px){
    .rw-head{display:none}
    .rw-row{grid-template-columns:1fr auto;grid-template-areas:"dokter jml" "ket ket" "tgl status" "aksi aksi";row-gap:4px;padding:11px 2px}
    .rw-dokter{grid-area:dokter} .rw-jml{grid-area:jml} .rw-ket{grid-area:ket;white-space:normal}
    .rw-tgl{grid-area:tgl} .rw-status{grid-area:status;text-align:right} .rw-aksi{grid-area:aksi}
  }

  .empty{font-size:13px;color:var(--muted);text-align:center;padding:20px 0}
  .loading{font-size:13px;color:var(--muted);text-align:center;padding:10px 0}

  .hide{display:none}

  #printArea{display:none}
  @media print{
    body.printing > *:not(#printArea){display:none!important}
    body.printing #printArea{display:block!important}
    #printArea{font-family:Arial,sans-serif;color:#000;padding:0}
    #printArea h2{font-size:16px;color:#1c3144;margin-bottom:4px}
    #printArea table{width:100%;border-collapse:collapse;font-size:11px;margin:10px 0}
    #printArea th{background:#1c3144;color:#fff;padding:5px 7px;text-align:left}
    #printArea td{padding:5px 7px;border-bottom:1px solid #ddd}
  }
  .btn-hapus-file{margin-top:6px;padding:4px 10px;background:none;border:1.5px solid var(--line);border-radius:8px;color:var(--pink);font-size:11.5px;font-weight:700;cursor:pointer}
  .btn-cetak-nota{margin-top:8px;padding:5px 11px;background:var(--violet-dark);color:#fff;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}

  /* ---- Topbar sesi login ---- */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    background:#fff;border-radius:16px;padding:12px 16px;margin:0 20px 16px;
    box-shadow:0 4px 16px rgba(124,58,237,.06);
  }
  .topbar .nama{font-weight:700;font-size:13.5px}
  .topbar .role{font-size:11px;color:var(--muted)}
  .topbar .nav{display:flex;gap:14px;align-items:center}
  .topbar a{color:var(--violet-dark);font-weight:700;font-size:12.5px;text-decoration:none}
  .topbar button{background:none;border:none;color:var(--pink);font-weight:700;font-size:12.5px;cursor:pointer}

  /* ---- Gate (belum login) ---- */
  .gate{
    max-width:360px;margin:80px auto;text-align:center;padding:0 20px;
  }
  .gate .emoji{font-size:40px}
  .gate h2{font-family:'Sora',sans-serif;font-size:19px;margin:10px 0 6px}
  .gate p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .gate a{
    display:inline-block;background:var(--violet);color:#fff;text-decoration:none;
    font-family:'Sora',sans-serif;font-weight:700;font-size:14px;padding:12px 24px;border-radius:14px;
  }

  @media (min-width:860px){
    .topbar{margin:0 0 16px}
  }
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

  /* Menu dan tata letak: sidebar kiri di layar lebar, chip yang bisa digeser di HP */
  .topbar .nav a.aktif{background:#EDE7FD;color:var(--violet-dark)}
  @media (min-width:860px){
    body{display:block!important;padding:0!important}
    .wrap{display:block!important;max-width:980px!important;margin:0 0 0 272px!important;padding:32px 32px 60px 0!important}
    .hero{position:relative!important;top:auto!important;border-radius:22px!important;padding:26px 30px!important;margin-bottom:16px}
    .hero h1{font-size:26px!important}
    .section{padding:0!important}
    .topbar{position:fixed;left:24px;top:32px;width:224px;margin:0!important;flex-direction:column;align-items:stretch;gap:10px;padding:14px;max-height:calc(100vh - 64px);overflow-y:auto;z-index:20}
    .topbar .nama{font-size:14px}
    .topbar > div:first-child{padding:2px 6px 10px;border-bottom:1px solid var(--line)}
    .topbar .nav{flex-direction:column;align-items:stretch;gap:2px;flex-wrap:nowrap}
    .topbar .nav a,.topbar .nav button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-size:13px}
    .topbar .nav a:hover{background:#F4F1FB}
    .topbar .nav button:hover{background:#FFE9F1}
    .topbar .nav a.hide{display:none}
  }
  @media (max-width:859px){
    body{padding:0!important}
    .wrap{max-width:600px!important;margin:0 auto!important;padding-bottom:40px!important}
    .hero{padding:24px 20px 28px!important;border-radius:0 0 26px 26px!important}
    .hero h1{font-size:24px!important}
    .section{padding:0 14px!important}
    .topbar{display:flex!important;flex-direction:column;align-items:stretch!important;gap:10px;margin:14px 0!important;padding:12px 14px}
    .topbar > div:first-child{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .topbar .role{font-size:11px}
    .topbar .nav{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto;gap:6px!important;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .topbar .nav::-webkit-scrollbar{display:none}
    .topbar .nav a,.topbar .nav button{flex:0 0 auto;white-space:nowrap;padding:8px 13px;border-radius:999px;background:#F4F1FB;font-size:12.5px}
    .topbar .nav a.aktif{background:var(--violet);color:#fff}
    .topbar .nav button{background:#FFE9F1}
    .topbar .nav a.hide{display:none}
  }
</style>
</head>
<body>

<!-- Tampil kalau BELUM login -->
<div class="gate hide" id="gateBelumLogin">
  <div class="emoji">🔒</div>
  <h2>Belum Masuk</h2>
  <p>Silakan login dulu dengan PIN Anda sebelum mengajukan CN.</p>
  <a href="login.html">Ke Halaman Login</a>
</div>

<!-- Konten utama, cuma tampil kalau SUDAH login -->
<div id="appContent" class="hide">
<div class="wrap">

  <div class="hero">
    <h1>Pengajuan CN</h1>
    <p>Cari User, cek saldo, langsung ajukan.</p>
  </div>

  <div class="section">

    <div class="topbar">
      <div>
        <div class="nama" id="topbarNama"></div>
        <div class="role" id="topbarRole"></div>
      </div>
      <div class="nav">
        <a href="ajukan-cn.html">Pengajuan CN</a>
        <a href="approval.html">Approval</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="laporan-user.html">Laporan</a>
        <a href="admin-import.html" class="hide" id="navImport">Import</a>
        <a href="koreksi-invoice.html">Koreksi</a>
        <a href="admin-tools.html" class="hide" id="navTools">Tools</a>
        <a href="admin-staff.html" class="hide" id="navStaff">Staff</a>
        <a href="admin-tim.html" class="hide" id="navTim">Tim</a>
        <a href="ubah-pin.html">Ubah PIN</a>
        <button onclick="logout()">Keluar</button>
      </div>
    </div>

    <!-- Cari User -->
    <div class="card" id="cardCari">
      <h2>Cari User</h2>
      <input type="text" id="searchInput" placeholder="Memuat data user..." disabled>
      <div class="hint-area" id="hintArea" style="font-size:11.5px;color:var(--muted);margin-top:6px"></div>
      <div id="searchResults" style="margin-top:12px"></div>
    </div>

    <!-- User terpilih + form -->
    <div class="card hide" id="cardForm">
      <h2>Ajukan Request CN</h2>
      <div class="chip" id="userChip"></div>
      <button class="ganti" onclick="gantiUser()">Ganti User</button>

      <label>Jumlah Usulan (Rp)</label>
      <input type="number" id="jumlahInput" placeholder="Contoh: 1000000">
      <div class="banner" id="kelayakanBanner"></div>

      <div class="hide" id="guaranteeWrap">
        <label>Upload Surat Jaminan (wajib)</label>
        <input type="file" id="guaranteeFile" accept="application/pdf,image/jpeg,image/png,image/webp,image/heic,.pdf,.jpg,.jpeg,.png,.webp,.heic">
        <button type="button" class="btn-hapus-file" onclick="document.getElementById('guaranteeFile').value=''">✕ Hapus file</button>
      </div>

      <label>Keterangan / Keperluan</label>
      <textarea id="keteranganInput" rows="3" placeholder="Untuk keperluan apa?"></textarea>

      <button class="btn btn-primary" id="btnSubmit" onclick="submitCN()">Ajukan Sekarang</button>
      <div class="banner" id="submitBanner"></div>
    </div>

    <!-- Riwayat: SELALU berdasarkan siapa yang login (diajukan_oleh), BUKAN dokter yang sedang dipilih -->
    <div class="card" id="cardRiwayat">
      <h2>Riwayat Pengajuan Saya</h2>
      <input type="text" id="riwayatCari" placeholder="Cari nama dokter, ID, keterangan, atau status..." oninput="RIWAYAT_TAMPIL = 20; renderRiwayat()">
      <div id="riwayatInfo" style="font-size:11.5px;color:var(--muted);margin:6px 0 8px"></div>
      <div id="riwayatList"><div class="loading">Memuat...</div></div>
      <button type="button" class="btn-hapus-file hide" id="riwayatLagi" style="margin-top:10px" onclick="RIWAYAT_TAMPIL += 20; renderRiwayat()">Tampilkan 20 lagi</button>
    </div>

  </div>
</div>
</div>

<script src="nama-jabatan.js"></script>
<script>
const SUPABASE_URL = "https://larbyekmthmdkdcpdbcc.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhcmJ5ZWttdGhtZGtkY3BkYmNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjYxNzUsImV4cCI6MjEwNTgwMjE3NX0.0I-fqB1fVLaKR2Dz8jdrccns5tXdjDAqZdHxSwgukNk";

const FN_CARI_USER = "Cari_User_Saldo";
const FN_CEK_KELAYAKAN = "hyper-task"; // nama tampilan: Cek_Kelayakan_CN
const FN_SUBMIT_CN = "super-function"; // nama tampilan: Submit_req_CN
const FN_RIWAYAT = "Riwayat_CN_User";
const FN_UPLOAD_JAMINAN = "Upload_Jaminan";

// Ubah file jadi teks base64, supaya bisa dikirim lewat JSON ke Edge Function
// Periksa file Surat Jaminan begitu dipilih (aturannya sama dengan di server)
const JENIS_JAMINAN = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp', 'image/heic'];
document.getElementById('guaranteeFile').addEventListener('change', function () {
  const banner = document.getElementById('submitBanner');
  const f = this.files && this.files[0];
  if (!f) return;
  if (!JENIS_JAMINAN.includes(f.type)) {
    this.value = '';
    banner.className = 'banner show err';
    banner.textContent = 'Jenis file tidak didukung. Gunakan PDF atau foto (JPG, PNG).';
  } else if (f.size > 5 * 1024 * 1024) {
    this.value = '';
    banner.className = 'banner show err';
    banner.textContent = 'File terlalu besar (maksimal 5 MB).';
  } else if (banner.classList.contains('err')) {
    banner.className = 'banner';
  }
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]); // buang bagian "data:...;base64," di depan
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ===== Cek sesi login dulu, sebelum apa pun lain dijalankan =====
const SESSION = JSON.parse(localStorage.getItem('staffSession') || 'null');
if (!SESSION) {
  document.getElementById('gateBelumLogin').classList.remove('hide');
  document.getElementById('appContent').classList.add('hide');
  // Hentikan sisa script di bawah ini, karena tidak ada yang perlu dijalankan
  throw new Error('STOP: belum login');
} else {
  document.getElementById('appContent').classList.remove('hide');
  document.getElementById('topbarNama').textContent = SESSION.nama;
  const roleLabel = [].concat(SESSION.is_admin ? ['Admin'] : [], (SESSION.roles || []).map(r => ((window.NJ && NJ.peran) ? NJ.peran(r.role) : (r.role === 'PSR_AM' ? 'PSR/AM' : String(r.role).replace(/_/g, ' '))))).join(', ') || 'Peran tidak terdeteksi';
  document.getElementById('topbarRole').textContent = roleLabel;
  if (SESSION.is_admin) { document.getElementById('navImport').classList.remove('hide'); document.getElementById('navTools').classList.remove('hide'); document.getElementById('navStaff').classList.remove('hide'); document.getElementById('navTim').classList.remove('hide'); }
}

function logout() {
  localStorage.removeItem('staffSession');
  window.location.href = 'login.html';
}

function tanganiSesi(hasil) {
  // Server menolak karena token tidak sah atau sudah berakhir: kembali ke halaman login
  if (hasil && hasil.kode === 'SESI_TIDAK_VALID') {
    localStorage.removeItem('staffSession');
    alert('Sesi Anda sudah berakhir. Silakan login ulang.');
    window.location.href = 'login.html';
  }
  return hasil;
}

function tokenSesi() {
  try { return (JSON.parse(localStorage.getItem('staffSession') || 'null') || {}).token || null; }
  catch (e) { return null; }
}

function bacaSesi() {
  try { return JSON.parse(localStorage.getItem('staffSession') || 'null'); } catch (e) { return null; }
}

// Token berlaku pendek (15 menit). Halaman memperbaruinya otomatis di belakang layar.
// Pembaruan ditolak server kalau akunnya sudah dinonaktifkan, dan peran dibaca ulang dari database.
let _pembaruan = null;
function perbaruiSesi() {
  if (_pembaruan) return _pembaruan; // satu pembaruan saja pada satu waktu
  _pembaruan = fetch(`${SUPABASE_URL}/functions/v1/Perbarui_Sesi`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${ANON_KEY}`, "apikey": ANON_KEY },
    body: JSON.stringify({ token: tokenSesi() })
  })
    .then(r => r.json())
    .then(h => {
      if (h && h.token) {
        const s = bacaSesi() || {};
        s.token = h.token; s.tokenExp = h.token_exp; s.roles = h.roles; s.is_admin = h.is_admin;
        localStorage.setItem('staffSession', JSON.stringify(s));
        return true;
      }
      if (h && h.kode === 'SESI_TIDAK_VALID') tanganiSesi(h); // akun nonaktif atau sesi habis: keluar
      return false;
    })
    .catch(() => false) // jaringan putus: jangan mengeluarkan orang
    .finally(() => { _pembaruan = null; });
  return _pembaruan;
}

async function pastikanSesiSegar() {
  const s = bacaSesi();
  if (!s || !s.token) return;
  const sisaMs = s.tokenExp ? Date.parse(s.tokenExp) - Date.now() : 0;
  if (sisaMs < 2 * 60 * 1000) await perbaruiSesi();
}

async function panggil(fn, body, sudahCoba) {
  await pastikanSesiSegar();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${ANON_KEY}`, "apikey": ANON_KEY },
    body: JSON.stringify({ ...(body || {}), token: tokenSesi() })
  });
  const hasil = await res.json();
  if (hasil && hasil.kode === 'SESI_TIDAK_VALID' && !sudahCoba && await perbaruiSesi()) {
    return panggil(fn, body, true); // token baru saja diperbarui: ulangi sekali
  }
  return tanganiSesi(hasil);
}

function rupiah(n) {
  return "Rp " + Math.round(Number(n) || 0).toLocaleString('id-ID');
}

// ===== Batasan pencarian user =====
// Pengaju (PSR/AM, DM, SM) hanya boleh mencari user di wilayahnya sendiri:
//  - SM  : seluruh region miliknya
//  - PSR/AM dan DM : area miliknya (dan region-nya kalau datanya ada)
// Admin dan peran yang bukan pengaju (Finance, BOM, Direktur) tidak dibatasi.
function hitungBatasanPencarian() {
  const peran = (SESSION.roles || []).filter(r => ['PSR_AM', 'DM', 'SM'].includes(r.role));
  if (!peran.length) return { areas: null, regions: null };

  const regionSet = new Set();
  const areaSet = new Set();
  peran.forEach(r => (r.regions || []).forEach(x => regionSet.add(x)));
  const punyaSM = peran.some(r => r.role === 'SM');
  if (!punyaSM) peran.forEach(r => (r.areas || []).forEach(x => areaSet.add(x)));

  return {
    areas: punyaSM ? null : Array.from(areaSet), // array kosong = area tidak terdeteksi -> hasil sengaja kosong
    regions: regionSet.size ? Array.from(regionSet) : null
  };
}

// ===== Cache daftar user =====
let USER_CACHE = null;
async function loadUserCache() {
  const input = document.getElementById('searchInput');
  try {
    const batasan = hitungBatasanPencarian();
    const hasil = await panggil(FN_CARI_USER, { areas: batasan.areas, regions: batasan.regions });
    USER_CACHE = (hasil.data || []).map(r => ({
      id_user: r.id_user,
      region: r.region,
      saldo: r.saldo_saat_ini,
      nama_user: r.users ? r.users.nama_user : '',
      area: r.users ? r.users.area : ''
    }));
    input.disabled = false;
    input.placeholder = 'Ketik ID User atau nama...';

    const hint = document.getElementById('hintArea');
    if (batasan.areas !== null || batasan.regions !== null) {
      if (batasan.areas !== null && batasan.areas.length === 0) {
        hint.textContent = '⚠️ Area Anda tidak terdeteksi dari data, hubungi admin.';
        hint.style.color = 'var(--red)';
      } else {
        const bagian = [];
        if (batasan.regions) bagian.push('Region: ' + batasan.regions.join(', '));
        if (batasan.areas) bagian.push(batasan.areas.length <= 6 ? 'Area: ' + batasan.areas.join(', ') : batasan.areas.length + ' area');
        hint.textContent = 'Pencarian dibatasi untuk ' + bagian.join(' · ');
        hint.style.color = '';
      }
    }
  } catch (e) {
    input.placeholder = 'Gagal memuat data, coba refresh halaman.';
  }
}
loadUserCache();

let SELECTED = null;
let KELAYAKAN = null;

function renderSearch(query) {
  const box = document.getElementById('searchResults');
  if (!USER_CACHE) { box.innerHTML = '<div class="loading">Memuat data...</div>'; return; }
  const q = query.trim().toUpperCase();
  if (!q) { box.innerHTML = ''; return; }
  const hasil = USER_CACHE.filter(u =>
    (u.id_user + ' ' + u.nama_user).toUpperCase().includes(q)
  ).slice(0, 8);
  if (!hasil.length) { box.innerHTML = '<div class="empty">Tidak ditemukan.</div>'; return; }
  box.innerHTML = hasil.map((u, i) => `
    <div class="result-item" onclick="pilihUser(${i})" data-idx="${i}">
      <div>
        <div class="nama">${u.nama_user || '(tanpa nama)'}</div>
        <div class="sub">${u.id_user} · ${u.region}</div>
      </div>
      <div class="saldo">${rupiah(u.saldo)}</div>
    </div>
  `).join('');
  box._current = hasil;
}

document.getElementById('searchInput').addEventListener('input', function () {
  renderSearch(this.value);
});

function pilihUser(idx) {
  const box = document.getElementById('searchResults');

    </div>
  `;

// ===== Cek kelayakan otomatis (debounce) =====
let debounceTimer;
document.getElementById('jumlahInput').addEventListener('input', function () {
  clearTimeout(debounceTimer);
  const jumlah = Number(this.value);
  if (!jumlah || jumlah <= 0) {
    document.getElementById('kelayakanBanner').className = 'banner';
    document.getElementById('guaranteeWrap').classList.add('hide');
    KELAYAKAN = null;
    return;
  }
  debounceTimer = setTimeout(() => cekKelayakan(jumlah), 450);
});

async function cekKelayakan(jumlah) {
  const banner = document.getElementById('kelayakanBanner');
  banner.className = 'banner show';
  banner.textContent = 'Mengecek kelayakan...';
  try {
    const hasil = await panggil(FN_CEK_KELAYAKAN, {
      id_user: SELECTED.id_user,
      region: SELECTED.region,
      jumlah_diminta: jumlah
    });
    KELAYAKAN = hasil;
    if (hasil.error) {
      banner.className = 'banner show err';
      banner.textContent = hasil.error;
      return;
    }
    const guaranteeWrap = document.getElementById('guaranteeWrap');
    if (hasil.selisih > 0) {
      banner.className = hasil.perluGuarantee ? 'banner show warn' : 'banner show warn';
      banner.textContent = hasil.pesan;
      guaranteeWrap.classList.toggle('hide', !hasil.perluGuarantee);
    } else {
      banner.className = 'banner show ok';
      banner.textContent = 'Saldo mencukupi, siap diajukan.';
      guaranteeWrap.classList.add('hide');
    }
  } catch (e) {
    banner.className = 'banner show err';
    banner.textContent = 'Gagal mengecek: ' + e.message;
  }
}

// ===== Submit CN =====
async function submitCN() {
  const jumlah = Number(document.getElementById('jumlahInput').value);
  const pengaju = SESSION.nama; // diambil dari sesi login, bukan ketik manual
  const keterangan = document.getElementById('keteranganInput').value.trim();
  const banner = document.getElementById('submitBanner');

  if (!jumlah || jumlah <= 0) { banner.className = 'banner show err'; banner.textContent = 'Isi jumlah usulan dulu.'; return; }
  if (!keterangan) { banner.className = 'banner show err'; banner.textContent = 'Isi keterangan dulu.'; return; }

  const btn = document.getElementById('btnSubmit');
  const perluGuarantee = !!(KELAYAKAN && KELAYAKAN.perluGuarantee);

  // Kalau wajib Surat Jaminan, pastikan filenya sudah dipilih SEBELUM lanjut
  const fileInput = document.getElementById('guaranteeFile');
  if (perluGuarantee && (!fileInput.files || !fileInput.files[0])) {
    banner.className = 'banner show err';
    banner.textContent = 'Upload Surat Jaminan dulu sebelum mengajukan.';
    return;
  }

  btn.disabled = true; btn.textContent = 'Mengirim...';
  banner.className = 'banner show';

  let linkGuarantee = null;
  try {
    if (perluGuarantee) {
      banner.textContent = 'Mengupload Surat Jaminan...';
      const file = fileInput.files[0];
      const base64 = await fileToBase64(file);
      const hasilUpload = await panggil(FN_UPLOAD_JAMINAN, {
        nama_file: file.name,
        mime_type: file.type,
        base64_data: base64,
        id_user: SELECTED.id_user,
        region: SELECTED.region
      });
      if (hasilUpload.error) {
        banner.className = 'banner show err';
        banner.textContent = 'Gagal upload Surat Jaminan: ' + hasilUpload.error;
        btn.disabled = false; btn.textContent = 'Ajukan Sekarang';
        return;
      }
      linkGuarantee = hasilUpload.link;
    }

    banner.textContent = 'Mengirim pengajuan...';
    const hasil = await panggil(FN_SUBMIT_CN, {
      id_user: SELECTED.id_user,
      region: SELECTED.region,
      nama_user: SELECTED.nama_user,
      jumlah_diminta: jumlah,
      keterangan: keterangan,
      diajukan_oleh: pengaju,
      region_pengaju: SELECTED.region,
      area_pengaju: SELECTED.area,
      perlu_guarantee: perluGuarantee,
      link_guarantee: linkGuarantee
    });
    if (hasil.error) {
      banner.className = 'banner show err';
      banner.textContent = hasil.error;
    } else {
      banner.className = 'banner show ok';
      const LABEL_TAHAP = { DM: 'DM', SM: 'SM', FINANCE_STAFF: 'Finance Staff' };
      banner.textContent = 'Berhasil diajukan! Menunggu approval ' + (LABEL_TAHAP[hasil.tahap_awal] || '') + '.';
      // Jumlah & keterangan dikosongkan (pengajuan baru biasanya beda nominal/keperluan),
      // tapi Nama Pengaju SENGAJA dibiarkan terisi (lihat localStorage di atas)
      document.getElementById('jumlahInput').value = '';
      document.getElementById('keteranganInput').value = '';
      document.getElementById('kelayakanBanner').className = 'banner';
      document.getElementById('guaranteeWrap').classList.add('hide');
      document.getElementById('guaranteeFile').value = '';
      KELAYAKAN = null;
      // Saldo user sudah terpotong begitu CN diajukan — perbarui angka di kartu user
      // supaya tidak menampilkan saldo lama (bisa jadi minus)
      if (typeof hasil.saldo_baru === 'number') {
        SELECTED.saldo = hasil.saldo_baru;
        const elSaldo = document.querySelector('#userChip .saldo-val');
        if (elSaldo) elSaldo.textContent = rupiah(hasil.saldo_baru);
      }
      loadRiwayat();
    }
  } catch (e) {
    banner.className = 'banner show err';
    banner.textContent = 'Gagal: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Ajukan Sekarang';
}

// ===== Riwayat =====
function pillClass(status) {
  if (status === 'Ditolak') return 'pill-no';
  if (status === 'Selesai') return 'pill-ok';
  return 'pill-wait';
}

let RIWAYAT_DATA = []; // data LENGKAP, dipakai juga saat Cetak
let RIWAYAT_TAMPIL = 20;

function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadRiwayat() {
  const list = document.getElementById('riwayatList');
  list.innerHTML = '<div class="loading">Memuat...</div>';
  try {
    // PENTING: riwayat ini "pengajuan SAYA" — difilter berdasarkan siapa yang login
    const hasil = await panggil(FN_RIWAYAT, { diajukan_oleh: SESSION.nama });
    RIWAYAT_DATA = hasil.data || [];
    renderRiwayat();
  } catch (e) {
    list.innerHTML = `<div class="empty">Gagal memuat: ${esc(e.message)}</div>`;
  }
}

function renderRiwayat() {
  const list = document.getElementById('riwayatList');
  const info = document.getElementById('riwayatInfo');
  const tombolLagi = document.getElementById('riwayatLagi');
  const q = (document.getElementById('riwayatCari').value || '').trim().toLowerCase();

  if (!RIWAYAT_DATA.length) {
    list.innerHTML = '<div class="empty">Belum ada riwayat.</div>';
    info.textContent = ''; tombolLagi.classList.add('hide');
    return;
  }

  const cocok = [];
  RIWAYAT_DATA.forEach((r, i) => {
    const teks = [r.nama_user, r.id_user, r.keterangan, r.no_kasbon, r.status].join(' ').toLowerCase();
    if (!q || teks.includes(q)) cocok.push(i);
  });
  const tampil = cocok.slice(0, RIWAYAT_TAMPIL);

  info.textContent = q
    ? `${cocok.length} dari ${RIWAYAT_DATA.length} pengajuan cocok`
    : `${RIWAYAT_DATA.length} pengajuan`;

  if (!cocok.length) {
    list.innerHTML = '<div class="empty">Tidak ada yang cocok.</div>';
    tombolLagi.classList.add('hide');
    return;
  }

  list.innerHTML =
    '<div class="rw-head"><div>Tanggal</div><div>Dokter</div><div>Keterangan</div><div style="text-align:right">Jumlah</div><div>Status</div><div></div></div>' +
    tampil.map(i => {
      const r = RIWAYAT_DATA[i];
      return `
      <div class="rw-row">
        <div class="rw-tgl">${new Date(r.created_at).toLocaleDateString('id-ID')}</div>
        <div class="rw-dokter"><b>${esc(r.nama_user) || '-'}</b><span>${esc(r.id_user)} · ${esc(r.region)}</span></div>
        <div class="rw-ket" title="${esc(r.keterangan)}">${esc(r.keterangan) || '-'}</div>
        <div class="rw-jml">${r.status === 'Selesai' && r.jumlah_penyelesaian != null
          ? `${rupiah(r.jumlah_penyelesaian)}<div style="font-size:10.5px;font-weight:500;color:var(--muted)">Usulan ${rupiah(r.jumlah_diminta)}</div>`
          : rupiah(r.jumlah_diminta)}</div>
        <div class="rw-status"><span class="pill ${pillClass(r.status)}">${esc(NJ.status(r.status))}</span></div>
        <div class="rw-aksi"><button class="btn-cetak-nota" onclick="cetakNota(RIWAYAT_DATA[${i}])">🖨 Cetak</button></div>
      </div>`;
    }).join('');

  tombolLagi.classList.toggle('hide', cocok.length <= tampil.length);
  tombolLagi.textContent = `Tampilkan ${Math.min(20, cocok.length - tampil.length)} lagi`;
}

// ===== Cetak Nota 1 Request CN (dipakai dari Riwayat) =====
function buatNotaHTML(r) {
  let html = `<h2>Pengajuan Request CN</h2>`;
  html += `<table>
    <tr><td style="width:35%"><b>Nama User</b></td><td>: ${r.nama_user || '-'} (${r.id_user})</td></tr>
    <tr><td><b>Region</b></td><td>: ${r.region || '-'}</td></tr>
    <tr><td><b>No. Kasbon</b></td><td>: ${r.no_kasbon || '-'}</td></tr>
    <tr><td><b>Jumlah Diminta</b></td><td>: ${rupiah(r.jumlah_diminta)}</td></tr>
    <tr><td><b>Keterangan</b></td><td>: ${r.keterangan || '-'}</td></tr>
    <tr><td><b>Diajukan Oleh</b></td><td>: ${r.diajukan_oleh || '-'}</td></tr>
    <tr><td><b>Tanggal Diajukan</b></td><td>: ${new Date(r.created_at).toLocaleString('id-ID')}</td></tr>
    <tr><td><b>Status Saat Ini</b></td><td>: ${NJ.status(r.status)}</td></tr>
    ${r.link_guarantee ? `<tr><td><b>Surat Jaminan</b></td><td>: Terlampir</td></tr>` : ''}
  </table>`;

  html += `<h2 style="margin-top:16px">Riwayat Approval</h2><table>
    <tr><th>Tahap</th><th>Approver</th><th>Tanggal</th><th>Catatan</th></tr>`;
  const tahapList = [
    ['DM', r.dm_approver, r.dm_tanggal, r.dm_catatan],
    ['SM', r.sm_approver, r.sm_tanggal, r.sm_catatan],
    ['Finance Staff', r.finance_staff_approver, r.finance_staff_tanggal, r.finance_staff_catatan],
    [NJ.nama('JR_FINANCE_MANAGER', 'Jr Finance Manager'), r.jr_finance_approver, r.jr_finance_tanggal, r.jr_finance_catatan],
    ['BOM', r.bom_approver, r.bom_tanggal, r.bom_catatan],
    ['Direktur', r.direktur_approver, r.direktur_tanggal, r.direktur_catatan],
  ];
  tahapList.forEach(([label, approver, tgl, catatan]) => {
    if (!approver) return; // lewati tahap yang belum diproses
    html += `<tr><td>${label}</td><td>${approver}</td><td>${tgl || '-'}</td><td>${catatan || '-'}</td></tr>`;
  });
  html += '</table>';

  if (r.status === 'Ditolak') {
    html += `<div style="margin-top:10px;padding:8px;background:#fde8e6;border-radius:6px;font-size:12px">
      <b>Ditolak pada tahap ${r.ditolak_pada_tahap || '-'}</b> oleh ${r.ditolak_oleh || '-'} pada ${r.tanggal_ditolak || '-'}<br>
      Alasan: ${r.alasan_ditolak || '-'}
    </div>`;
  }

  if (r.status === 'Selesai') {
    html += `<h2 style="margin-top:16px">Realisasi</h2><table>
      <tr><td style="width:35%"><b>Jumlah Penyelesaian</b></td><td>: ${rupiah(r.jumlah_penyelesaian)}</td></tr>
      <tr><td><b>Jumlah Mutasi</b></td><td>: ${rupiah(r.jumlah_mutasi)}</td></tr>
      <tr><td><b>Sisa Dikembalikan</b></td><td>: ${rupiah(r.sisa)}</td></tr>
      <tr><td><b>Direalisasi Oleh</b></td><td>: ${r.realisasi_oleh || '-'}</td></tr>
    </table>`;
  }

  html += `<p style="font-size:10px;color:#888;margin-top:14px">Dicetak pada: ${new Date().toLocaleString('id-ID')}</p>`;
  return html;
}

function cetakNota(r) {
  document.getElementById('printArea').innerHTML = buatNotaHTML(r);
  document.body.classList.add('printing');
  window.print();
  setTimeout(() => document.body.classList.remove('printing'), 500);
}
